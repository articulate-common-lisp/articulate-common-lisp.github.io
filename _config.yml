# Jekyll configuration

name: articulate-lisp.com
description: A jekyll theme

# url is currently only used only for the RSS feed in feed.xml.
# Must be https: GitHub Pages enforces HTTPS, so http:// feed links redirect.
url: https://articulate-lisp.com

# baseurl will often be '', but for a project page on gh-pages, it needs to
# be the project name.
# *** IMPORTANT: If your local "jekyll serve" throws errors change this to '' or
#     run it like so: jekyll serve --baseurl=''
baseurl: ''

# This can be '' to hide the Github nav button
github: 'articulate-common-lisp/articulate-common-lisp.github.io'

# Set this to your disqus shortname to enable comments. Note that the 'comments'
# setting below must also be true. Individual posts can override 'comments' to
# disable on a post-by-post basis
disqus: ''
comments: true

permalink: /:year/:month/:title

# Jekyll 4 ships kramdown and rouge. The old redcarpet/pygments settings were
# fatal the moment any Markdown page gained front matter:
#   "Invalid Markdown processor given: redcarpet" -> site could not be built.
markdown: kramdown
highlighter: rouge

# NOTE: setting `exclude` REPLACES Jekyll's built-in defaults rather than
# adding to them, so the defaults worth keeping are repeated here. The old
# value (['README.md', 'LICENSE']) named two files that do not exist in this
# repo and dropped the defaults, so the site published its own Dockerfile,
# shell scripts and server source.
# Do NOT exclude CNAME - GitHub Pages needs it in the built output to keep
# the custom domain.
exclude:
  - AUTHORS.md
  - Dockerfile
  - Gemfile
  - Gemfile.lock
  - HACKING.md
  - README.org
  - build.sh
  - livetest.sh
  - test.sh
  - node_modules
  - source
  - vendor
